<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khấu Vấn Tiên Đạo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Noto+Serif+TC:wght@400;700&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: #020305;
      color: #e5dec9;
      font-family: 'Noto Serif TC', serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fix tỉ lệ 16:9 */
    .stage {
      position: relative;
      width: 100vw;
      height: 56.25vw;   /* 16:9 */
      max-height: 100vh;
      max-width: 177.78vh; /* 16:9 */
      overflow: hidden;
    }

    /* Mỗi layer đều phủ tuyệt đối, trùng khít */
    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* LAYER 0: Ảnh gốc home_image.png */
    .bg-layer {
      z-index: 1;
      filter: brightness(0.93) contrast(1.04);
    }

    /* ============================================
       SPRITE LAYERS (các vật phẩm cắt riêng)
       - Bình thường: trong suốt, ẩn hoàn toàn
       - Khi hover vào vùng cảm ứng: hiện lên với
         hào quang ôm sát viền vật thể
       ============================================ */
    .sprite-layer {
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, filter 0.35s ease;
    }

    /* ============================================
       VÙNG CẢM ỨNG (Hitbox) — trong suốt, đặt
       đúng vị trí vật phẩm trên ảnh nền
       ============================================ */
    .hitbox {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    /* ========================================================
       TOOLTIP PHONG CÁCH TIÊN HIỆP: LỆNH BÀI KHẮC KIM TỤ KHÍ
       ======================================================== */

    .hitbox-tooltip {
      position: absolute;
      bottom: -14px;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.25, 1),
                  transform 0.4s cubic-bezier(0.2, 0.8, 0.25, 1);
      z-index: 50;
      /* Hiệu ứng hào quang linh lực tỏa ra xung quanh thẻ */
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.9))
              drop-shadow(0 0 20px rgba(212, 175, 55, 0.35));
    }

    /* Khi rê chuột: Tooltip trôi lên nhẹ nhàng và bắt đầu nhấp nhô lơ lửng */
    .hitbox:hover .hitbox-tooltip {
      opacity: 1;
      transform: translateX(-50%) translateY(92%);
      animation: immortalFloat 3.5s ease-in-out infinite alternate;
    }

    /* Thân lệnh bài - Cắt 8 góc cổ kính (Octagonal talisman) */
    .tooltip-inner {
      position: relative;
      background: radial-gradient(circle at 50% 30%, #171412 0%, #080605 100%);
      padding: 10px 18px 9px 18px;
      text-align: center;
      /* Cắt vát 4 góc kiểu lệnh bài môn phái */
      clip-path: polygon(
        8px 0%, calc(100% - 8px) 0%,
        100% 8px, 100% calc(100% - 8px),
        calc(100% - 8px) 100%, 8px 100%,
        0% calc(100% - 8px), 0% 8px
      );
      /* Viền kép mạ đồng vàng */
      border: 1px solid #d4af37;
      box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.25);
    }

    /* Viền chỉ vàng lồng bên trong (Double antique frame) */
    .tooltip-inner::before {
      content: "";
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      clip-path: polygon(
        7px 0%, calc(100% - 7px) 0%,
        100% 7px, 100% calc(100% - 7px),
        calc(100% - 7px) 100%, 7px 100%,
        0% calc(100% - 7px), 0% 7px
      );
      pointer-events: none;
    }

    /* Vệt sáng linh quang lướt qua khi hover */
    .tooltip-inner::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 248, 220, 0.25), transparent);
      transform: skewX(-25deg);
      pointer-events: none;
    }

    /* Khi hover: Vệt sáng lặp lại vô tận, mỗi chu kỳ kéo dài 3 giây */
    .hitbox:hover .tooltip-inner::after {
      animation: shimmerGleam 3s ease-in-out infinite;
    }

    /* Hàng trên: Phẩm giai & Phân loại */
    .tooltip-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    /* Dấu triện son / ngọc ấn */
    .spirit-badge {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 1px 6px;
      border-radius: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 6px currentColor;
    }

    /* Triện Chu Sa Đỏ */
    .red-seal {
      background: #420b0b;
      color: #ff7b7b;
      border: 1px solid #991b1b;
    }

    /* Triện Bích Ngọc */
    .jade-seal {
      background: #092c1c;
      color: #6ee7b7;
      border: 1px solid #059669;
    }

    /* Triện Hoàng Kim */
    .gold-seal {
      background: #382404;
      color: #fde047;
      border: 1px solid #ca8a04;
    }

    .spirit-rank {
      font-size: 0.62rem;
      letter-spacing: 2px;
      color: #a8a29e;
      font-family: 'Noto Serif TC', serif;
    }

    /* Tên vật phẩm: Chữ thếp vàng, cổ điển */
    .tooltip-title {
      font-family: 'Playfair Display', 'Noto Serif TC', serif;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 2.5px;
      color: #fff4d1;
      text-shadow: 0 1px 2px #000, 0 0 10px rgba(212, 175, 55, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Ký tự phù văn ❖ */
    .rune {
      color: #d4af37;
      font-size: 0.68rem;
      opacity: 0.85;
      text-shadow: 0 0 8px #fef08a;
    }

    /* Khẩu quyết hành động phía dưới */
    .tooltip-sub {
      font-size: 0.62rem;
      color: #d6d3d1;
      font-style: italic;
      letter-spacing: 1.5px;
      margin-top: 3px;
      opacity: 0.8;
    }

    /* Hoạt ảnh lơ lửng như ngự khí phi hành */
    @keyframes immortalFloat {
      0% {
        transform: translateX(-50%) translateY(92%);
      }
      100% {
        transform: translateX(-50%) translateY(98%);
      }
    }

    @keyframes shimmerGleam {
     0% {
      left: -100%;
     }
     60% {
      /* Mất ~1 giây để lướt trọn vẹn qua lệnh bài */
      left: 160%;
     }
     100% {
      /* ~2 giây còn lại đứng yên bên ngoài (thời gian nghỉ giữa các lần lướt) */
      left: 160%;
     }
    }

    /* Cổ Thư */
    .hitbox-tome {
      top: 48%;
      left: 7%;
      width: 13%;
      height: 18%;
    }

    .hitbox-tome:hover ~ .sprite-tome {
      opacity: 1;
      filter:
        drop-shadow(0 0 5px rgba(255, 248, 225, 0.4))
        drop-shadow(0 0 12px rgba(245, 230, 195, 0.25))
        drop-shadow(0 0 24px rgba(225, 210, 175, 0.14))
        brightness(1.08);
    }

    .hitbox-tome:active ~ .sprite-tome {
      opacity: 1;
      filter:
        drop-shadow(0 0 8px rgba(255, 252, 235, 0.55))
        drop-shadow(0 0 18px rgba(245, 235, 205, 0.35))
        drop-shadow(0 0 30px rgba(230, 215, 185, 0.2))
        brightness(1.12);
    }

    /* Ngọc Phật */
    .hitbox-buddha {
      top: 40%;
      right: 16.5%;
      width: 6%;
      height: 12%;
    }

    .hitbox-buddha:hover ~ .sprite-buddha {
      opacity: 1;
      filter:
        drop-shadow(0 0 5px rgba(255, 248, 225, 0.4))
        drop-shadow(0 0 12px rgba(245, 230, 195, 0.25))
        drop-shadow(0 0 24px rgba(225, 210, 175, 0.14))
        brightness(1.08);
    }

    .hitbox-buddha:active ~ .sprite-buddha {
      opacity: 1;
      filter:
        drop-shadow(0 0 8px rgba(255, 252, 235, 0.55))
        drop-shadow(0 0 18px rgba(245, 235, 205, 0.35))
        drop-shadow(0 0 30px rgba(230, 215, 185, 0.2))
        brightness(1.12);
    }

    /* Sơn Hà Đồ */
    .hitbox-map {
      top: 22%;
      left: 33%;
      width: 33%;
      height: 35%;
    }

    .hitbox-map:hover ~ .sprite-map {
      opacity: 1;
      filter:
        drop-shadow(0 0 5px rgba(230, 225, 240, 0.35))
        drop-shadow(0 0 14px rgba(210, 205, 225, 0.22))
        drop-shadow(0 0 28px rgba(190, 185, 215, 0.12))
        brightness(1.08);
    }

    .hitbox-map:active ~ .sprite-map {
      opacity: 1;
      filter:
        drop-shadow(0 0 8px rgba(240, 235, 250, 0.5))
        drop-shadow(0 0 18px rgba(220, 215, 235, 0.3))
        drop-shadow(0 0 30px rgba(200, 195, 225, 0.18))
        brightness(1.12);
    }

    /* ============================================
       HẠT BỤI LINH KHÍ (Canvas)
       ============================================ */
    #particles-canvas {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    /* ============================================
       HEADER & FOOTER OVERLAY
       ============================================ */
    .sanctum-header {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      z-index: 30;
      text-align: center;
      pointer-events: none;
    }

    .sanctum-title {
      font-family: 'Playfair Display', 'Merriweather', serif;
      font-weight: 800;
      font-size: clamp(1.4rem, 2.8vw, 2.6rem);
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff7d6 0%, #d4af37 60%, #8c6d1f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 20px rgba(212, 175, 55, 0.35));
    }

    .sanctum-subtitle {
      font-size: clamp(0.6rem, 1vw, 0.88rem);
      letter-spacing: 4px;
      color: #cbd5e1;
      margin-top: 4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    }

    /* Bottom Status Bar */
    .sanctum-footer {
      position: absolute;
      bottom: 16px;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 20;
      font-size: 0.8rem;
      color: #94a3b8;
      letter-spacing: 2px;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    /* ============================================
       MODAL (Ngọc Phật / Bản Đồ popup)
       ============================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }
    .modal-box {
      background: radial-gradient(circle at 50% 20%, #1a1612 0%, #0c0a08 100%);
      border: 1px solid #d4af37;
      outline: 1px solid rgba(212, 175, 55, 0.4);
      outline-offset: -5px;
      /* Cắt vát góc cổ phong thay vì bo tròn */
      clip-path: polygon(
        14px 0, calc(100% - 14px) 0,
        100% 14px, 100% calc(100% - 14px),
        calc(100% - 14px) 100%, 14px 100%,
        0 calc(100% - 14px), 0 14px
      );
      padding: 38px 32px;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(212, 175, 55, 0.25);
      transform: scale(0.92);
      transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .modal-overlay.active .modal-box {
      transform: scale(1);
    }
    .modal-box h3 {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: #fef08a;
      font-size: 1.4rem;
      margin-bottom: 12px;
    }
    .modal-box p {
      color: #cbd5e1;
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .modal-btn {
      padding: 10px 24px;
      background: linear-gradient(180deg, #d4af37 0%, #aa841c 100%);
      border: 1px solid #d4af37;
      border-radius: 8px;
      color: #050608;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      font-size: 0.88rem;
    }
    .modal-btn:hover {
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
    }
    .modal-close {
      display: block;
      margin-top: 14px;
      color: #64748b;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="stage">

  <!-- LAYER 0: Ảnh nền gốc -->
  <img src="images/home_image.png" alt="Thư Phòng Tu Tiên" class="layer bg-layer">

  <!-- VÙNG CẢM ỨNG (HITBOX) ĐÃ NÂNG CẤP TOOLTIP CỔ PHONG -->
  <!-- 1. CỔ THƯ -->
  <a href="reader.html" class="hitbox hitbox-tome">
    <div class="hitbox-tooltip">
      <div class="tooltip-inner">
        <div class="tooltip-header">
          <span class="spirit-badge gold-seal">TIÊN KHÍ</span>
          <span class="spirit-rank">???????</span>
        </div>
        <div class="tooltip-title">
          <span class="rune">❖</span> CỔ THƯ VÔ DANH <span class="rune">❖</span>
        </div>
        <div class="tooltip-sub">« Nhấp ??? »</div>
      </div>
    </div>
  </a>

  <!-- 2. NGỌC PHẬT -->
  <div class="hitbox hitbox-buddha" onclick="openModal('map')">
    <div class="hitbox-tooltip">
      <div class="tooltip-inner">
        <div class="tooltip-header">
          <span class="spirit-badge gold-seal">TIÊN KHÍ</span>
          <span class="spirit-rank">???????</span>
        </div>
        <div class="tooltip-title">
          <span class="rune">❖</span> NGỌC PHẬT <span class="rune">❖</span>
        </div>
        <div class="tooltip-sub">« Nhấp ??? »</div>
      </div>
    </div>
  </div>

  <!-- 3. SƠN HÀ ĐỒ -->
  <div class="hitbox hitbox-map" onclick="openModal('map')">
    <div class="hitbox-tooltip">
      <div class="tooltip-inner">
        <div class="tooltip-header">
          <span class="spirit-badge gold-seal">TIÊN KHÍ</span>
          <span class="spirit-rank">???????</span>
        </div>
        <div class="tooltip-title">
          <span class="rune">❖</span> CỬU CHÂU SƠN HÀ ĐỒ <span class="rune">❖</span>
        </div>
        <div class="tooltip-sub">« Nhấp ??? »</div>
      </div>
    </div>
  </div>

  <!-- SPRITE LAYERS: Ảnh vật phẩm cắt riêng, phủ trùng khít lên nền -->
  <!-- Bình thường ẩn (opacity: 0), khi hover hitbox → hiện lên + hào quang viền -->
  <img src="images/sub_image1.png" alt="" class="layer sprite-layer sprite-tome">
  <img src="images/sub_image2.png" alt="" class="layer sprite-layer sprite-buddha">
  <img src="images/sub_image3.png" alt="" class="layer sprite-layer sprite-map">

  <!-- Hạt bụi linh khí -->
  <canvas id="particles-canvas"></canvas>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
    <button class="modal-btn" id="modalBtn"></button>
    <span class="modal-close" onclick="closeModal()">Đóng</span>
  </div>
</div>

<script>
  // Particles
  const canvas = document.getElementById('particles-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height;
      this.size = Math.random() * 2 + 0.5;
      this.speedX = (Math.random() - 0.5) * 0.3;
      this.speedY = -Math.random() * 0.4 - 0.1;
      this.opacity = Math.random() * 0.5 + 0.1;
      this.color = Math.random() > 0.4 ? '255, 215, 0' : '220, 240, 255';
    }
    update() {
      this.x += this.speedX;
      this.y += this.speedY;
      if (this.y < 0 || this.x < 0 || this.x > canvas.width) {
        this.reset();
        this.y = canvas.height;
      }
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
      ctx.fill();
    }
  }

  for (let i = 0; i < 45; i++) {
    particles.push(new Particle());
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }
  animate();

  // Modal
  function openModal(type) {
    const overlay = document.getElementById('modalOverlay');
    const title = document.getElementById('modalTitle');
    const desc = document.getElementById('modalDesc');
    const btn = document.getElementById('modalBtn');

    if (type === 'buddha') {
      title.innerText = '🪷 NGỌC PHẬT BỔN MỆNH';
      desc.innerText = 'Thần vật thượng cổ ẩn chứa cơ duyên nghịch thiên. Không gian bí cảnh nhập vai thế giới mở 2.5D đang trong giai đoạn ngưng tụ linh khí...';
      btn.innerText = 'ĐÃ RÕ (SẮP RA MẮT)';
      btn.onclick = closeModal;
    } else if (type === 'map') {
      title.innerText = '🗺️ CỬU CHÂU SƠN HÀ ĐỒ';
      desc.innerText = 'Bản đồ toàn cảnh Tu Chân Giới: Đông Cực Minh Hải, Bắc Hoang Hàn Cực, Nam Lĩnh Vu Cốc, Trung Châu Tiên Minh. Chưa mở khóa bản đồ chi tiết do tu vi chưa đủ.';
      btn.innerText = 'THU HỒI BẢN ĐỒ';
      btn.onclick = closeModal;
    }
    overlay.classList.add('active');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>

</body>
</html>
