name: CI/CD Pipeline - Khau Van  Tien Dao

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # STAGE 1: Check code 
  check-code:
    name: Kiem Tra Files
    runs-on: ubuntu-latest
    steps:
      - name: Keo code ve
        uses: actions/checkout@v4

      - name: Kiem tra su ton tai cua cac file giao dien
        run: |
          echo "Kiem tra file index / preview..."
          ls -la
          test -f preview_landing_chamber.html || test -f index.html
          echo "Tat ca file da san sang!"

  # STAGE 2: Deploy len Vercel
  deploy:
    name: Deploy Len Vercel
    needs: check-code
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Keo code ve
        uses: actions/checkout@v4

      - name: Deploy len Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.USER_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
